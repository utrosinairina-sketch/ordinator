<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f8c"><title>Ординатор</title>
<style>
:root{--teal:#087f8c;--ink:#17252b;--muted:#64747a;--bg:#f3f7f8;--line:#dce6e8;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}header{background:var(--teal);color:white;padding:16px;position:sticky;top:0;z-index:4}header h1{font-size:23px;margin:0}header p{margin:4px 0 0;font-size:13px}.wrap{padding:14px 14px 95px;max-width:760px;margin:auto}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.card,.syscard{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.muted{color:var(--muted);font-size:13px}.big{font-size:21px;font-weight:750}.btn{border:0;border-radius:11px;background:var(--teal);color:white;padding:11px 13px;font:inherit;font-size:14px;font-weight:650}.secondary{background:#e8f2f3;color:#075a63}.danger{background:#fff0ef;color:var(--red)}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd8db;border-radius:10px;background:white;color:var(--ink);font:inherit}textarea{min-height:70px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:white;color:var(--muted);padding:7px 1px;border-radius:9px;font-size:11px}.nav button.active{background:#e8f5f5;color:var(--teal);font-weight:750}.nav span{display:block;font-size:19px}.sectionTitle{font-size:17px;font-weight:750;margin:17px 0 8px}.chips{display:flex;gap:6px;overflow:auto;padding:5px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:20px;padding:8px 10px}.chip.active{background:var(--teal);color:white}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayname{text-align:center;color:var(--muted);font-size:12px;padding:5px 0}.day{min-height:43px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:5px 0;font:inherit}.day.outside{opacity:.35}.day.selected{background:var(--teal);color:white;font-weight:bold}.day.today:not(.selected){border:2px solid var(--teal)}.dot{display:block;width:5px;height:5px;border-radius:50%;background:#e08b24;margin:3px auto 0}.selected .dot{background:white}.hidden{display:none}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.result{border-top:1px solid var(--line);padding:9px 0}.notice{font-size:12px;background:#fff3dc;padding:10px;border-radius:10px;color:#754c00}.medrow{border-top:1px solid var(--line);padding:12px 0}.status{display:inline-block;border-radius:20px;padding:4px 8px;font-size:12px;background:#e8f2f3;color:#075a63}.warn{background:#fff3dc;color:#754c00}.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px}.diff>div{background:#f3f7f8;padding:9px;border-radius:9px;overflow-wrap:anywhere}.smallbtn{padding:8px 10px;margin:3px 3px 3px 0}.med-actions{display:flex;flex-wrap:wrap;gap:5px}.nav button{font-size:10px}.nav span{font-size:17px}
</style></head><body>
<header><h1>Ординатор</h1><p>Пациенты · обход · исследования · календарь</p></header><main id="app" class="wrap"></main>
<nav class="nav"><button data-page="walk" class="active"><span>🩺</span>Обход</button><button data-page="patients"><span>👥</span>Пациенты</button><button data-page="graphs"><span>📈</span>Графики</button><button data-page="calendar"><span>🗓️</span>Календарь</button><button data-page="tasks"><span>✓</span>Задачи</button><button data-page="therapy"><span>💊</span>Терапия</button></nav>
<script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
'use strict';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const systems=[['general','Общее состояние'],['cardio','Сердечно-сосудистая система'],['resp','Дыхательная система'],['gi','ЖКТ'],['renal','Мочевыделительная система'],['neuro','Нервная система'],['wound','Рана и дренажи'],['hemostasis','Кровь и гемостаз'],['other','Прочее']];
const labs=['ОАК: Hb','ОАК: лейкоциты','ОАК: тромбоциты','СРБ','Прокальцитонин','Креатинин','Мочевина','Na⁺','K⁺','Mg²⁺','Ca²⁺','АЛТ / АСТ','Билирубин','Глюкоза','МНО / ПВ','АЧТВ','Фибриноген','Тропонин','NT-proBNP','КЩС: pH','КЩС: pCO₂','КЩС: лактат','Другое'];
const studies=['ЭКГ','ЭхоКГ: ФВ ЛЖ','ЭхоКГ: клапаны / протезы','Рентген грудной клетки','КТ','УЗИ / допплерография','Холтер','Другое исследование'];
const examFields=[['cardio','Сердечно-сосудистая система',[['АД','120/70 мм рт. ст.'],['ЧСС','уд/мин'],['Тоники','Препарат, доза, скорость инфузии'],['ЭКС','Режим и параметры']]],['resp','Дыхательная система',[['ЧДД','дых/мин'],['Сатурация','SpO₂, кислородная поддержка']]],['renal','Баланс жидкости',[['Баланс жидкости','Поступило, выделено, диурез, итог за период']]]];
let state;try{state=JSON.parse(localStorage.getItem('ord_v3')||'null')}catch(e){state=null}if(!state||typeof state!=='object')state={patients:[],tasks:[],events:[]};state.patients??=[];state.tasks??=[];state.events??=[];
let page='walk',selected=null,patientTab='exam',therapyEditId=null,therapyDraft=null,therapyPreview=null,therapyCompare=null,calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),calDate=today();const app=document.getElementById('app');
function save(){try{localStorage.setItem('ord_v3',JSON.stringify(state))}catch(e){alert('Не удалось сохранить данные в памяти браузера. Освободи место или проверь настройки сайта.')}}
function patient(id){return state.patients.find(p=>p.id===id)}function ensure(p){p.exam??={};p.rounds??=[];p.results??=[];p.notes??='';p.created??=today();p.therapy??=[];p.therapyHistory??=[]}
function btn(t,fn,cls='btn'){return `<button type="button" class="${cls}" onclick="${fn}">${t}</button>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(selected&&patient(selected)){renderPatient(patient(selected));return}({walk:renderWalk,patients:renderPatients,graphs:renderGraphs,calendar:renderCalendar,tasks:renderTasks,therapy:renderTherapyHome}[page]||renderWalk)()}
function renderWalk(){app.innerHTML=`<div class="row between"><div><div class="big">Обход</div><div class="muted">Ежедневные показатели</div></div>${btn('+ Пациент','newPatient()')}</div>${state.patients.map(p=>{ensure(p);let r=p.rounds.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];return `<div class="card"><strong>${esc(p.name||'Новый пациент')}</strong><div class="muted">${esc(p.ward||'Палата —')} · ${esc(p.diagnosis||'Диагноз не указан')}</div><div class="muted" style="margin:8px 0">${r?`Последний обход ${esc(r.date)} · АД ${esc(r.bp||'—')} · ЧСС ${esc(r.hr||'—')} · SpO₂ ${esc(r.spo2||'—')}`:'Записей обхода пока нет'}</div>${btn('Открыть карту',`openPatient('${p.id}')`,'btn secondary')}</div>`}).join('')||'<div class="card">Пока нет пациентов. Нажми «+ Пациент».</div>'}`}
function renderPatients(){app.innerHTML=`<div class="row between"><div class="big">Пациенты</div>${btn('+ Добавить','newPatient()')}</div>${state.patients.map(p=>`<div class="card"><strong>${esc(p.name||'Новый пациент')}</strong><div class="muted">${esc(p.ward||'Палата —')} · ${esc(p.diagnosis||'Диагноз не указан')}</div><div style="margin-top:10px">${btn('Открыть',`openPatient('${p.id}')`,'btn secondary')}</div></div>`).join('')||'<div class="card">Добавь первого пациента.</div>'}`}
function newPatient(){const id='p'+Date.now();state.patients.push({id,name:'',ward:'',diagnosis:'',exam:{},rounds:[],results:[],notes:'',created:today()});save();selected=id;patientTab='exam';renderPatient(patient(id))}
function openPatient(id){selected=id;ensure(patient(id));patientTab='exam';renderPatient(patient(id))}
function renderPatient(p){ensure(p);const tabs=[['exam','Осмотр'],['walk','Обход'],['labs','Лаборатория'],['studies','Инструментальные'],['therapy','Терапия'],['history','История']];app.innerHTML=`<div class="row between">${btn('← Назад',"selected=null;render()",'btn secondary')}${patientTab==='therapy'&&therapyDraft?btn('Отменить редактирование','cancelTherapyEdit()','btn secondary'):btn('Сохранить','savePatient()')}</div><div class="card"><label>ФИО / условное обозначение</label><input id="pname" value="${esc(p.name)}" placeholder="Пациент 01"><div class="grid"><div><label>Палата</label><input id="pward" value="${esc(p.ward)}"></div><div><label>Дата поступления</label><input id="pcreated" type="date" value="${esc(p.created)}"></div></div><label>Диагноз / операция</label><textarea id="pdiagnosis">${esc(p.diagnosis)}</textarea></div><div class="chips">${tabs.map(([k,t])=>`<button class="chip ${patientTab===k?'active':''}" onclick="patientTab='${k}';renderPatient(patient('${p.id}'))">${t}</button>`).join('')}</div>${patientTab==='exam'?renderExam(p):patientTab==='walk'?renderRounds(p):patientTab==='labs'?renderResults(p,'lab'):patientTab==='studies'?renderResults(p,'study'):patientTab==='therapy'?renderPatientTherapy(p):renderHistory(p)}<label>Общие замечания / план</label><textarea id="pnotes" placeholder="Проблемы, жалобы, план">${esc(p.notes)}</textarea><div style="margin-top:10px">${therapyDraft&&patientTab==='therapy'?'':btn('Сохранить карту','savePatient()')} ${!therapyDraft?btn('Удалить пациента',`deletePatient('${p.id}')`,'btn danger'):''}</div><p class="notice">Данные хранятся локально в браузере. Не вводи реальные идентифицирующие данные пациентов.</p>`}
function renderExam(p){return `<div class="sectionTitle">Осмотр и параметры</div><label>Дата и время осмотра</label><input id="examdate" type="datetime-local" value="${esc(p.examDate||new Date().toISOString().slice(0,16))}">${examFields.map(([id,name,fields])=>`<div class="syscard"><strong>${name}</strong>${fields.map(([key,ph])=>`<label>${key}</label><textarea data-exam="${id}|${key}" placeholder="${ph}">${esc((p.exam[id]||{})[key]||'')}</textarea>`).join('')}</div>`).join('')}`}
function renderRounds(p){const rows=p.rounds.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="sectionTitle">Ежедневный обход</div><div class="card"><label>Дата</label><input id="rd-date" type="date" value="${today()}"><div class="grid">${[['bp','АД','120/80'],['hr','ЧСС','80'],['rr','ЧДД','16'],['spo2','SpO₂','98'],['urine','Диурез, мл','1500'],['intake','Поступило жидкости, мл','2000'],['temp','Температура','36.6'],['stool','Стул','Был / не было']].map(([id,l,ph])=>`<div><label>${l}</label><input id="rd-${id}" placeholder="${ph}"></div>`).join('')}</div><div style="margin-top:12px">${btn('Сохранить запись',`addRound('${p.id}')`)}</div></div><div class="sectionTitle">Динамика</div>${rows.map(r=>`<div class="card"><strong>${esc(r.date)}</strong><div class="muted">АД ${esc(r.bp||'—')} · ЧСС ${esc(r.hr||'—')} · ЧДД ${esc(r.rr||'—')} · SpO₂ ${esc(r.spo2||'—')}% · диурез ${esc(r.urine||'—')} мл</div>${btn('Удалить',`deleteRound('${p.id}','${r.id}')`,'btn danger')}</div>`).join('')||'<div class="muted">Записей пока нет.</div>'}`}
function addRound(pid){const p=patient(pid),v=id=>document.getElementById('rd-'+id).value.trim();p.rounds.push({id:'r'+Date.now(),date:document.getElementById('rd-date').value||today(),bp:v('bp'),hr:v('hr'),rr:v('rr'),spo2:v('spo2'),urine:v('urine'),intake:v('intake'),temp:v('temp'),stool:v('stool')});save();renderPatient(p)}
function deleteRound(pid,id){const p=patient(pid);p.rounds=p.rounds.filter(r=>r.id!==id);save();renderPatient(p)}
function savePatient(){const p=patient(selected);if(!p)return;ensure(p);p.name=document.getElementById('pname').value.trim();p.ward=document.getElementById('pward').value.trim();p.created=document.getElementById('pcreated').value||today();p.diagnosis=document.getElementById('pdiagnosis').value;p.notes=document.getElementById('pnotes').value;p.examDate=document.getElementById('examdate')?.value||p.examDate||today();document.querySelectorAll('[data-exam]').forEach(el=>{const [sys,key]=el.dataset.exam.split('|');p.exam[sys]??={};p.exam[sys][key]=el.value});save();renderPatient(p)}
function renderResults(p,type){const options=type==='lab'?labs:studies;return `<div class="sectionTitle">${type==='lab'?'Лабораторные показатели':'Инструментальные исследования'} по системам</div>${systems.map(([id,name])=>{const arr=p.results.filter(r=>r.type===type&&(r.system||'other')===id);return `<div class="syscard"><strong>${name}</strong><label>Показатель / исследование</label><select id="rn-${id}">${options.map(x=>`<option>${esc(x)}</option>`).join('')}<option value="__custom">Другое (ввести вручную)</option></select><input id="rc-${id}" placeholder="Название, если выбрано «Другое»"><label>Дата</label><input id="rdt-${id}" type="date" value="${today()}"><label>Текущий результат / заключение</label><textarea id="rv-${id}" placeholder="Значение, единицы или заключение"></textarea><label>Предыдущий результат</label><textarea id="rp-${id}" placeholder="Значение и дата"></textarea><label>Комментарий</label><input id="rcom-${id}" placeholder="Единицы, референс, динамика"><div style="margin-top:10px">${btn('Добавить',`addResult('${p.id}','${type}','${id}')`)}</div>${arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<div class="result"><div class="row between"><strong>${esc(r.name)}</strong><span class="muted">${esc(r.date)}</span></div><div>${esc(r.value||'—')}</div><div class="muted">Предыдущий: ${esc(r.previous||'—')}</div>${r.comment?`<div class="muted">${esc(r.comment)}</div>`:''}${btn('Удалить',`deleteResult('${p.id}','${r.id}')`,'btn danger')}</div>`).join('')}</div>`}).join('')}`}
function addResult(pid,type,sys){const p=patient(pid),value=document.getElementById('rv-'+sys).value.trim();if(!value){alert('Введи результат или заключение');return}const sel=document.getElementById('rn-'+sys),custom=document.getElementById('rc-'+sys).value.trim();p.results.push({id:'res'+Date.now(),type,system:sys,name:sel.value==='__custom'?(custom||'Другое'):sel.value,date:document.getElementById('rdt-'+sys).value||today(),value,previous:document.getElementById('rp-'+sys).value.trim(),comment:document.getElementById('rcom-'+sys).value.trim()});save();renderPatient(p)}
function deleteResult(pid,id){const p=patient(pid);p.results=p.results.filter(r=>r.id!==id);save();renderPatient(p)}
function renderHistory(p){return `<div class="sectionTitle">История результатов</div>${p.results.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<div class="card"><strong>${esc(r.name)}</strong><div class="muted">${esc(r.date)} · ${r.type==='lab'?'Лаборатория':'Инструментальное'} · ${esc((systems.find(s=>s[0]===r.system)||systems[8])[1])}</div><div>${esc(r.value||'—')}</div><div class="muted">Предыдущий: ${esc(r.previous||'—')}</div></div>`).join('')||'<div class="muted">Результатов пока нет.</div>'}`}
function deletePatient(id){if(confirm('Удалить карточку пациента и все записи?')){state.patients=state.patients.filter(p=>p.id!==id);save();selected=null;render()}}
// --- Вкладка «Терапия»: назначения, подтверждение изменений, история и сравнение таблиц ---
const therapyGroups=['Антиагреганты','Антикоагулянты','Антиаритмические','Бета-адреноблокаторы','Ингибиторы АПФ / БРА / ARNI','Диуретики','Статины и гиполипидемические','Антибиотики','Анальгетики','Гастропротекция','Электролиты и инфузии','Другие'];
const therapyRoutes=['Внутрь','Внутривенно','Внутримышечно','Подкожно','Ингаляционно','Наружно','Через зонд','Инфузия','Другое / уточнить'];
const therapyStatuses=['Действует','Приостановлено','Отменено','Завершено'];
function therapyPatientName(p){return p?.name?.trim()||'Пациент без имени'}
function renderTherapyHome(){
  app.innerHTML=`<div class="big">Терапия</div><div class="muted">Назначения, история изменений и сравнение Excel</div><div class="notice">Это рабочий журнал, а не система клинической поддержки решений. Он проверяет заполнение и логическую согласованность, но не рассчитывает безопасные дозы и не заменяет проверку врача. Не вводи реальные идентифицирующие данные, пока не обеспечено защищённое хранение.</div>${state.patients.map(p=>{ensure(p);const active=p.therapy.filter(m=>m.status==='Действует').length;const pending=p.therapy.filter(m=>m.status==='Черновик').length;return `<div class="card"><div class="row between"><div><strong>${esc(therapyPatientName(p))}</strong><div class="muted">${esc(p.ward||'Палата не указана')} · ${active} действующих назначений</div></div>${btn('Открыть',`openTherapyPatient('${p.id}')`,'btn secondary')}</div>${pending?`<div class="muted">Черновиков: ${pending}</div>`:''}</div>`}).join('')||'<div class="card">Сначала добавь пациента во вкладке «Пациенты».</div>'}<div class="card"><strong>Сравнение Excel</strong><p class="muted">Можно выбрать два файла или два листа одного файла. Сравнение не изменяет текущие назначения автоматически.</p>${renderTherapyCompareForm()}</div><div class="card"><strong>Общая история терапии</strong>${renderGlobalTherapyHistory()}</div>`;
}
function openTherapyPatient(id){selected=id;ensure(patient(id));patientTab='therapy';therapyEditId=null;therapyDraft=null;therapyPreview=null;renderPatient(patient(id))}
function openTherapyCompare(){selected=null;page='therapy';therapyCompare=null;renderTherapyHome();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function medById(p,id){return p.therapy.find(m=>m.id===id)}
function therapyWarnings(m){const w=[];if(!m.name?.trim())w.push('Не указано название препарата');if(!m.dose?.trim())w.push('Не указана назначенная доза');if(!m.unit?.trim())w.push('Не указана единица измерения');if(!m.route?.trim())w.push('Не указан путь введения');if(!m.frequency?.trim())w.push('Не указана кратность / режим');if(m.startDate&&m.endDate&&m.endDate<m.startDate)w.push('Дата окончания раньше даты начала');if(m.duration?.trim()&&!/^\d+(?:[.,]\d+)?\s*(ч|час|часа|часов|д|день|дня|дней|нед|недел|мес|месяц|месяца|месяцев)?$/i.test(m.duration.trim()))w.push('Длительность требует ручной проверки формата');return w}
function renderPatientTherapy(p){ensure(p);if(therapyPreview)return renderTherapyPreview(p);if(therapyDraft)return renderTherapyEditor(p);const active=p.therapy.filter(m=>m.status==='Действует'),others=p.therapy.filter(m=>m.status!=='Действует');const groups={};active.forEach(m=>(groups[m.group||'Другие']??=[]).push(m));return `<div class="sectionTitle">Текущие назначения</div><div class="med-actions">${btn('+ Добавить назначение',`startTherapyEdit('${p.id}',null)`)}${btn('Сравнить Excel','openTherapyCompare()','btn secondary')}${btn('История изменений',`therapyShowHistory('${p.id}')`,'btn secondary')}</div>${Object.entries(groups).map(([g,items])=>`<div class="syscard"><strong>${esc(g)}</strong>${items.map(m=>renderMedCard(p,m)).join('')}</div>`).join('')||'<div class="card muted">Действующих назначений пока нет.</div>'}${others.length?`<div class="sectionTitle">Другие статусы</div><div class="card">${others.map(m=>renderMedCard(p,m)).join('')}</div>`:''}${therapyEditId==='history'?`<div class="sectionTitle">История изменений терапии</div>${renderPatientTherapyHistory(p)}`:''}<div class="sectionTitle">Потенциальные проблемы, требующие внимания</div>${renderTherapyWarnings(p)}<div class="sectionTitle">История изменений</div>${renderPatientTherapyHistory(p)}<p class="notice">Все изменения сохраняются только после подтверждения. Предупреждения проверяют полноту и формат полей; клинические взаимодействия и дозы автоматически не оцениваются.</p>`}
function renderMedCard(p,m){const w=therapyWarnings(m);return `<div class="medrow"><div class="row between"><strong>${esc(m.name||'Без названия')}</strong><span class="status ${m.status==='Черновик'?'warn':''}">${esc(m.status||'Действует')}</span></div><div>${esc([m.dose,m.unit].filter(Boolean).join(' ' )||'Доза не указана')}</div><div class="muted">${esc(m.route||'Путь не указан')} · ${esc(m.frequency||'Кратность не указана')}</div><div class="muted">${esc(m.duration||'Длительность не указана')}${m.startDate?' · с '+esc(m.startDate):''}${m.endDate?' · до '+esc(m.endDate):''}</div>${w.length?`<div class="notice" style="margin-top:8px">Требует проверки: ${esc(w.join('; '))}</div>`:''}${m.comment?`<div class="muted">${esc(m.comment)}</div>`:''}<div class="med-actions">${btn('Редактировать',`startTherapyEdit('${p.id}','${m.id}')`,'btn secondary smallbtn')}${btn('История препарата',`therapyDrugHistory('${p.id}','${m.id}')`,'btn secondary smallbtn')}${m.status==='Действует'?btn('Отменить назначение',`startTherapyCancel('${p.id}','${m.id}')`,'btn danger smallbtn'):''}</div></div>`}
function startTherapyEdit(pid,id){const p=patient(pid);ensure(p);therapyEditId=id;therapyPreview=null;const old=id?medById(p,id):null;therapyDraft={id:id||'med'+Date.now(),name:old?.name||'',ingredient:old?.ingredient||'',form:old?.form||'',dose:old?.dose||'',unit:old?.unit||'',route:old?.route||'',frequency:old?.frequency||'',duration:old?.duration||'',startDate:old?.startDate||today(),endDate:old?.endDate||'',group:old?.group||'Другие',reason:'',comment:old?.comment||'',status:old?.status||'Действует',source:old?.source||'Ручной ввод'};renderPatient(p)}
function renderTherapyEditor(p){const d=therapyDraft;return `<div class="sectionTitle">${therapyEditId?'Редактирование назначения':'Новое назначение'}</div><div class="card"><label>Препарат *</label><input id="med-name" value="${esc(d.name)}" placeholder="Название препарата"><label>Действующее вещество</label><input id="med-ingredient" value="${esc(d.ingredient)}" placeholder="Если известно"><label>Лекарственная форма</label><input id="med-form" value="${esc(d.form)}" placeholder="Если применимо"><div class="grid"><div><label>Назначенная доза *</label><input id="med-dose" value="${esc(d.dose)}" placeholder="Не угадывать"></div><div><label>Единица измерения *</label><input id="med-unit" value="${esc(d.unit)}" placeholder="мг, мкг/кг/мин…"></div></div><label>Путь введения *</label><select id="med-route"><option value="">Выбрать / уточнить</option>${therapyRoutes.map(x=>`<option ${d.route===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Кратность / режим введения *</label><input id="med-frequency" value="${esc(d.frequency)}" placeholder="Точное назначение, например по схеме врача"><label>Длительность курса</label><input id="med-duration" value="${esc(d.duration)}" placeholder="Не рассчитывается автоматически"><div class="grid"><div><label>Дата начала</label><input id="med-start" type="date" value="${esc(d.startDate)}"></div><div><label>Дата окончания</label><input id="med-end" type="date" value="${esc(d.endDate)}"></div></div><label>Фармакологическая группа</label><select id="med-group">${therapyGroups.map(x=>`<option ${d.group===x?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Причина изменения / назначения</label><textarea id="med-reason" placeholder="Если известна">${esc(d.reason)}</textarea><label>Комментарий</label><textarea id="med-comment" placeholder="Дополнительные сведения">${esc(d.comment)}</textarea><div class="notice">Поля со звёздочкой нужны для базовой проверки, но полнота формы не означает, что назначение клинически безопасно. Не вноси неподтверждённые значения.</div><div class="med-actions" style="margin-top:12px">${btn('Проверить и посмотреть «Было → Стало»','prepareTherapyPreview()')}${btn('Отмена','cancelTherapyEdit()','btn secondary')}</div></div>`}
function readTherapyEditor(){const get=id=>document.getElementById(id)?.value?.trim()||'';return {...therapyDraft,name:get('med-name'),ingredient:get('med-ingredient'),form:get('med-form'),dose:get('med-dose'),unit:get('med-unit'),route:get('med-route'),frequency:get('med-frequency'),duration:get('med-duration'),startDate:get('med-start'),endDate:get('med-end'),group:get('med-group'),reason:get('med-reason'),comment:get('med-comment')}}
function prepareTherapyPreview(){const p=patient(selected);if(!p)return;therapyDraft=readTherapyEditor();const w=therapyWarnings(therapyDraft);if(w.length&&!confirm('Есть пункты, требующие проверки:\n\n'+w.join('\n')+'\n\nПродолжить к экрану сравнения?'))return;therapyPreview={draft:{...therapyDraft},warnings:w};renderPatient(p)}
function renderTherapyPreview(p){const d=therapyPreview.draft,old=medById(p,d.id);const fields=[['Препарат','name'],['Действующее вещество','ingredient'],['Форма','form'],['Доза','dose'],['Единица','unit'],['Путь введения','route'],['Кратность / режим','frequency'],['Длительность','duration'],['Дата начала','startDate'],['Дата окончания','endDate'],['Группа','group']];const diffs=fields.filter(([_,k])=>(old?.[k]||'')!==(d[k]||''));return `<div class="sectionTitle">Проверка изменения: Было → Стало</div><div class="card"><p class="muted">Проверь все значения. До нажатия «Подтвердить и сохранить» текущее назначение не меняется.</p>${diffs.map(([label,k])=>`<div class="medrow"><strong>${esc(label)}</strong><div class="diff"><div><div class="muted">Было</div>${esc(old?.[k]||'—')}</div><div><div class="muted">Стало</div>${esc(d[k]||'—')}</div></div></div>`).join('')||'<p class="muted">Параметры не изменились.</p>'}${therapyPreview.warnings.length?`<div class="notice"><strong>Проверить перед подтверждением</strong><ul>${therapyPreview.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}<label>Причина</label><div>${esc(d.reason||'Не указана')}</div><label>Комментарий</label><div>${esc(d.comment||'—')}</div><div class="med-actions" style="margin-top:14px">${btn('Подтвердить и сохранить',`confirmTherapySave('${p.id}')`)}${btn('Вернуться к редактированию','backTherapyEditor()','btn secondary')}${btn('Отменить','cancelTherapyEdit()','btn danger')}</div></div>`}
function confirmTherapySave(pid){const p=patient(pid);if(!p||!therapyPreview)return;ensure(p);const d={...therapyPreview.draft};const old=medById(p,d.id);const now=new Date().toISOString();const action=old?'Изменение назначения':'Создание назначения';const snapshot=old?{...old}:null;const saved={...d,status:old?.status||'Действует',createdAt:old?.createdAt||now,updatedAt:now};if(old){const i=p.therapy.findIndex(m=>m.id===old.id);p.therapy[i]=saved}else p.therapy.push(saved);p.therapyHistory.push({id:'th'+Date.now(),medId:saved.id,medName:saved.name,action,at:now,old:snapshot,next:{...saved},reason:d.reason||'',author:'',source:d.source||'Ручной ввод',status:'Подтверждено'});save();therapyEditId=null;therapyDraft=null;therapyPreview=null;renderPatient(p)}
function backTherapyEditor(){therapyDraft={...therapyPreview.draft};therapyPreview=null;renderPatient(patient(selected))}
function cancelTherapyEdit(){therapyEditId=null;therapyDraft=null;therapyPreview=null;if(selected&&patient(selected))renderPatient(patient(selected));else renderTherapyHome()}
function startTherapyCancel(pid,id){const p=patient(pid),m=medById(p,id);if(!m)return;const reason=prompt('Причина отмены (необязательно). Оставь пустым, если не указана:','');if(reason===null)return;if(!confirm(`Подтвердить отмену назначения «${m.name}»? Препарат останется в истории.`))return;const old={...m};m.status='Отменено';m.updatedAt=new Date().toISOString();p.therapyHistory.push({id:'th'+Date.now(),medId:m.id,medName:m.name,action:'Отмена назначения',at:new Date().toISOString(),old,next:{...m},reason:reason.trim(),author:'',source:'Ручной ввод',status:'Подтверждено'});save();renderPatient(p)}
function renderPatientTherapyHistory(p,drugId=null){const rows=(p.therapyHistory||[]).filter(h=>!drugId||h.medId===drugId).slice().sort((a,b)=>b.at.localeCompare(a.at));return rows.map(h=>`<div class="medrow"><strong>${esc(h.medName||'Препарат')}</strong><div>${esc(h.action)}</div><div class="muted">${esc(new Date(h.at).toLocaleString('ru-RU'))} · ${esc(h.status||'Подтверждено')}</div>${h.reason?`<div>Причина: ${esc(h.reason)}</div>`:''}${h.old&&h.next?`<details><summary>Показать изменения</summary>${Object.keys({...h.old,...h.next}).filter(k=>!['id','createdAt','updatedAt'].includes(k)&&(h.old[k]||'')!==(h.next[k]||'')).map(k=>`<div class="muted">${esc(k)}: ${esc(h.old[k]||'—')} → ${esc(h.next[k]||'—')}</div>`).join('')}</details>`:''}</div>`).join('')||'<div class="muted">История пока пуста.</div>'}
function therapyDrugHistory(pid,id){const p=patient(pid);therapyEditId='drughistory:'+id;const m=medById(p,id);if(!m)return;app.innerHTML=`<div class="row between">${btn('← К терапии',`therapyBackToPatient('${pid}')`,'btn secondary')}<strong>История препарата</strong></div><div class="card"><strong>${esc(m.name)}</strong>${renderPatientTherapyHistory(p,id)}</div>`}
function therapyBackToPatient(pid){selected=pid;patientTab='therapy';therapyEditId=null;renderPatient(patient(pid))}
function therapyShowHistory(pid){selected=pid;therapyEditId='history';patientTab='therapy';renderPatient(patient(pid))}
function renderTherapyWarnings(p){const warnings=[];p.therapy.filter(m=>m.status==='Действует').forEach(m=>therapyWarnings(m).forEach(w=>warnings.push({name:m.name,warning:w,id:m.id})));return warnings.length?warnings.map(w=>`<div class="notice" style="margin:6px 0"><strong>${esc(w.name||'Назначение')}:</strong> ${esc(w.warning)}</div>`).join(''):'<div class="muted">Нет выявленных проблем полноты/формата. Это не означает, что клиническая безопасность проверена.</div>'}
function renderGlobalTherapyHistory(){const rows=state.patients.flatMap(p=>(p.therapyHistory||[]).map(h=>({...h,patientName:therapyPatientName(p),pid:p.id}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,20);return rows.map(h=>`<div class="medrow"><strong>${esc(h.medName||'Препарат')}</strong><div>${esc(h.action)} · ${esc(h.patientName)}</div><div class="muted">${esc(new Date(h.at).toLocaleString('ru-RU'))}</div></div>`).join('')||'<div class="muted">Подтверждённых изменений пока нет.</div>'}
function renderTherapyCompareForm(){return `<label>Первый Excel / CSV</label><input type="file" id="therapy-file-a" accept=".xlsx,.xls,.csv"><label>Второй Excel / CSV (для сравнения двух файлов)</label><input type="file" id="therapy-file-b" accept=".xlsx,.xls,.csv"><div class="med-actions" style="margin-top:10px">${btn('Сравнить два файла','compareTherapyFiles()')}${btn('Сравнить два листа первого файла','compareTherapySheets()','btn secondary')}</div><p class="muted">Для XLSX/XLS используется локальное чтение в браузере через библиотеку SheetJS. Если библиотека недоступна, CSV можно прочитать без неё; XLSX потребует подключения библиотеки. Файлы не отправляются на сервер этим кодом.</p>${therapyCompare?renderTherapyCompareResult():''}`}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if((c===','||c===';'||c==='\t')&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);return rows}
async function readTherapyFile(file){if(!file)throw new Error('Выбери файл.');const ext=file.name.toLowerCase().split('.').pop();if(ext==='csv'||ext==='txt'){const text=await file.text();return {name:file.name,sheets:[{name:'CSV',rows:parseCSV(text)}]}}if(!window.XLSX)throw new Error('Библиотека чтения XLSX не загрузилась. Проверь интернет или используй CSV.');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return {name:file.name,sheets:wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})}))}}
function normHeader(s){return String(s||'').toLowerCase().replace(/[ё]/g,'е').replace(/[^a-zа-я0-9]/g,'')}
function rowsToMeds(rows){if(!rows?.length)return [];let headerIndex=rows.findIndex(r=>r.some(c=>/препарат|лекарств|назван|drug|medication/i.test(String(c))));if(headerIndex<0)headerIndex=0;const headers=(rows[headerIndex]||[]).map(normHeader);const find=patterns=>headers.findIndex(h=>patterns.some(p=>h.includes(p)));const ix={name:find(['препарат','лекарствосредство','название','наименован','drug','medication']),ingredient:find(['действующеевещество']),dose:find(['назначеннаядоза','доза','dose']),unit:find(['единица','едизм','unit']),route:find(['путьвведения','введение','route']),frequency:find(['кратность','режим','частота','frequency']),duration:find(['длительность','курс','duration']),startDate:find(['датаначала','начало','startdate']),endDate:find(['датаокончания','окончание','enddate']),group:find(['группа'])};return rows.slice(headerIndex+1).filter(r=>r.some(x=>String(x).trim())).map((r,i)=>{const val=k=>ix[k]>=0?String(r[ix[k]]??'').trim():'';return {id:'import'+i,name:val('name')||String(r[0]||'').trim(),ingredient:val('ingredient'),dose:val('dose'),unit:val('unit'),route:val('route'),frequency:val('frequency'),duration:val('duration'),startDate:val('startDate'),endDate:val('endDate'),group:val('group'),raw:r}}).filter(m=>m.name)}
function medMatchKey(m){return normHeader(m.ingredient||m.name)}
function compareMedLists(a,b){const used=new Set(),out=[];for(const x of a){const key=medMatchKey(x);const candidates=b.map((y,i)=>({y,i})).filter(z=>!used.has(z.i)&&medMatchKey(z.y)===key);if(candidates.length===1){const {y,i}=candidates[0];used.add(i);const fields=['name','ingredient','dose','unit','route','frequency','duration','startDate','endDate','group'];const diffs=fields.filter(k=>String(x[k]||'').trim()!==String(y[k]||'').trim());out.push({type:diffs.length?'Изменено':'Без изменений',a:x,b:y,diffs})}else if(candidates.length>1){out.push({type:'Требует проверки: неоднозначное совпадение',a:x,b:null,diffs:[]})}else out.push({type:'Отсутствует во втором источнике',a:x,b:null,diffs:[]})}b.forEach((y,i)=>{if(!used.has(i)&&!a.some(x=>medMatchKey(x)===medMatchKey(y)))out.push({type:'Добавлено во втором источнике',a:null,b:y,diffs:[]})});return out}
async function compareTherapyFiles(){try{const a=await readTherapyFile(document.getElementById('therapy-file-a').files[0]);const b=await readTherapyFile(document.getElementById('therapy-file-b').files[0]);const ra=a.sheets[0]?.rows||[],rb=b.sheets[0]?.rows||[];therapyCompare={title:`${a.name} ↔ ${b.name}`,results:compareMedLists(rowsToMeds(ra),rowsToMeds(rb)),sourceA:a.name,sourceB:b.name};renderTherapyHome()}catch(e){alert(e.message||'Не удалось сравнить файлы.')}}
async function compareTherapySheets(){try{const file=document.getElementById('therapy-file-a').files[0];const data=await readTherapyFile(file);if(data.sheets.length<2)throw new Error('В первом файле должно быть не менее двух листов.');const names=data.sheets.map(s=>s.name);const first=prompt('Название первого листа:\n'+names.join('\n'),names[0]);if(first===null)return;const second=prompt('Название второго листа:\n'+names.join('\n'),names.find(n=>n!==first)||names[1]);if(second===null)return;const a=data.sheets.find(s=>s.name===first),b=data.sheets.find(s=>s.name===second);if(!a||!b)throw new Error('Не удалось найти выбранные листы.');therapyCompare={title:`${file.name}: ${first} ↔ ${second}`,results:compareMedLists(rowsToMeds(a.rows),rowsToMeds(b.rows)),sourceA:first,sourceB:second};renderTherapyHome()}catch(e){alert(e.message||'Не удалось сравнить листы.')}}
function renderTherapyCompareResult(){const rows=therapyCompare.results||[];const types=['Добавлено во втором источнике','Отсутствует во втором источнике','Изменено','Без изменений','Требует проверки: неоднозначное совпадение'];return `<div class="sectionTitle">Результат: ${esc(therapyCompare.title)}</div><div class="grid">${types.map(t=>`<div class="card"><div class="muted">${esc(t)}</div><strong>${rows.filter(r=>r.type===t).length}</strong></div>`).join('')}</div>${rows.map(r=>`<div class="medrow"><strong>${esc(r.type)}</strong><div>${esc(r.a?.name||r.b?.name||'Не распознано')}</div>${r.diffs?.length?`<div class="muted">Отличия: ${r.diffs.map(k=>esc(k)).join(', ')}</div><details><summary>Было → Стало</summary>${r.diffs.map(k=>`<div class="diff"><div><div class="muted">${esc(k)} · источник 1</div>${esc(r.a[k]||'—')}</div><div><div class="muted">${esc(k)} · источник 2</div>${esc(r.b[k]||'—')}</div></div>`).join('')}</details>`:''}${r.type==='Отсутствует во втором источнике'?'<div class="notice">Отсутствие в файле не означает отмену назначения. Ничего не отменено и не изменено.</div>':''}</div>`).join('')||'<div class="muted">Не удалось распознать строки назначений. Проверь заголовки столбцов.</div>'}<div class="med-actions">${btn('Очистить результат','therapyCompare=null;renderTherapyHome()','btn secondary')}</div>`}

function renderCalendar(){const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],months=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];let cells='';for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,has=state.tasks.some(t=>t.date===key)||state.events.some(e=>e.date===key);cells+=`<button class="day ${d.getMonth()!==m?'outside':''} ${key===calDate?'selected':''} ${key===today()?'today':''}" onclick="selectDate('${key}')">${d.getDate()}${has?'<span class="dot"></span>':''}</button>`}const items=[...state.tasks.filter(t=>t.date===calDate).map(t=>({...t,kind:'task'})),...state.events.filter(e=>e.date===calDate).map(e=>({...e,kind:'event'}))];app.innerHTML=`<div class="big">Календарь</div><div class="muted">Нажми на дату, чтобы увидеть задачи</div><div class="card"><div class="row between">${btn('‹',"changeMonth(-1)",'btn secondary')}<strong style="text-transform:capitalize">${months[m]} ${y}</strong>${btn('›',"changeMonth(1)",'btn secondary')}</div><div class="calendar-grid" style="margin-top:10px">${names.map(n=>`<div class="dayname">${n}</div>`).join('')}${cells}</div><div class="muted">● Есть задачи или события</div></div><div class="card"><strong>Задачи на ${esc(calDate)}</strong>${items.length?items.map(t=>`<div class="result"><div class="check"><input type="checkbox" ${t.done?'checked':''} ${t.kind==='event'?'disabled':''} onchange="toggleTask('${t.id}')"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(patient(t.pid)?.name||'Общее')} · ${t.kind==='task'?'Задача':'Событие'}</div></div></div></div>`).join(''):'<p class="muted">На эту дату задач нет.</p>'}</div><div class="card"><strong>Добавить событие</strong><label>Дата</label><input id="evdate" type="date" value="${esc(calDate)}"><label>Пациент</label><select id="evpatient"><option value="">Общее</option>${state.patients.map(p=>`<option value="${p.id}">${esc(p.name||'Пациент без имени')}</option>`).join('')}</select><label>Событие / исследование</label><input id="evtitle" placeholder="Например, ОАК, ЭхоКГ, консультация"><div style="margin-top:10px">${btn('Добавить в календарь','addEvent()')}</div></div>`}
function selectDate(d){calDate=d;renderCalendar()}function changeMonth(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);renderCalendar()}
function addEvent(){const title=document.getElementById('evtitle').value.trim();if(!title)return alert('Введи название события');calDate=document.getElementById('evdate').value||today();state.events.push({id:'e'+Date.now(),date:calDate,pid:document.getElementById('evpatient').value,title});calMonth=new Date(Number(calDate.slice(0,4)),Number(calDate.slice(5,7))-1,1);save();renderCalendar()}
function renderTasks(){app.innerHTML=`<div class="big">Задачи</div><div class="card"><label>Задача</label><input id="tasktitle" placeholder="Что нужно сделать"><label>Срок</label><input id="taskdate" type="date" value="${today()}"><label>Пациент</label><select id="taskpatient"><option value="">Общее</option>${state.patients.map(p=>`<option value="${p.id}">${esc(p.name||'Пациент без имени')}</option>`).join('')}</select><div style="margin-top:10px">${btn('Добавить задачу','addTask()')}</div></div>${state.tasks.map(t=>`<div class="card"><div class="check"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(t.date||'Без даты')} · ${esc(patient(t.pid)?.name||'Общее')}</div></div></div></div>`).join('')||'<div class="muted">Задач пока нет.</div>'}`}
function addTask(){const title=document.getElementById('tasktitle').value.trim();if(!title)return alert('Введи задачу');state.tasks.push({id:'t'+Date.now(),title,date:document.getElementById('taskdate').value||today(),pid:document.getElementById('taskpatient').value,done:false});save();renderTasks()}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function renderGraphs(){const p=patient(document.getElementById('graph-patient')?.value)||state.patients[0];if(!p){app.innerHTML='<div class="big">Графики</div><div class="card">Сначала добавь пациента и внеси числовые лабораторные результаты.</div>';return}ensure(p);const groups={};p.results.filter(r=>r.type==='lab'&&Number.isFinite(parseFloat(String(r.value).replace(',','.')))).forEach(r=>(groups[r.name]??=[]).push(r));app.innerHTML=`<div class="big">Графики анализов</div><label>Пациент</label><select id="graph-patient" onchange="renderGraphs()">${state.patients.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name||'Пациент без имени')} · ${esc(x.ward||'без палаты')}</option>`).join('')}</select>${Object.entries(groups).map(([name,arr])=>`<div class="card"><strong>${esc(name)}</strong>${arr.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<div class="result">${esc(r.date)} — ${esc(r.value)}</div>`).join('')}</div>`).join('')||'<div class="card">Нет числовых лабораторных результатов. Добавь их в карточке пациента.</div>'}`}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{selected=null;page=b.dataset.page;render()}));render();
</script></body></html>
