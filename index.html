<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087f8c">
  <meta name="description" content="Ординатор — локальный демонстрационный дневник наблюдения">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Ординатор</title>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-title"><h1>Ординатор</h1><span id="save-status" role="status">Готово</span></div>
    <p>Пациенты · осмотр · исследования · календарь</p>
  </header>
  <div id="storage-alert" class="storage-alert hidden" role="alert"></div>
  <main class="wrap" id="app"></main>
  <nav class="nav" aria-label="Основные разделы">
    <button type="button" data-action="page" data-page="patients" class="active"><span aria-hidden="true">👥</span>Пациенты</button>
    <button type="button" data-action="page" data-page="graphs"><span aria-hidden="true">📈</span>Динамика</button>
    <button type="button" data-action="page" data-page="calendar"><span aria-hidden="true">🗓️</span>Календарь</button>
    <button type="button" data-action="page" data-page="tasks"><span aria-hidden="true">✓</span>Задачи</button>
  </nav>
  <input id="backup-file" type="file" accept=".json,application/json" hidden>
  <input id="therapy-file" type="file" accept=".xlsx,.csv" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
