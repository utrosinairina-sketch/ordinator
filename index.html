<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f8c"><link rel="manifest" href="manifest.webmanifest"><title>Ординатор</title><style>
:root{--teal:#087f8c;--ink:#17252b;--muted:#64747a;--bg:#f3f7f8;--line:#dce6e8;--red:#b42318;--amber:#946200}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}header{background:var(--teal);color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:4}header h1{font-size:23px;margin:0}header p{margin:4px 0 0;font-size:13px;opacity:.9}.wrap{padding:14px 14px 94px;max-width:760px;margin:auto}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 7px #102b3310}.muted{color:var(--muted);font-size:13px}.big{font-size:21px;font-weight:750}.btn{border:0;border-radius:12px;background:var(--teal);color:white;padding:12px 14px;font-size:15px;font-weight:650;cursor:pointer}.btn.secondary{background:#e8f2f3;color:#075a63}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:var(--red)}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd8db;border-radius:10px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:82px;resize:vertical}label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sectionTitle{font-size:18px;font-weight:750;margin:18px 0 8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:white;color:var(--muted);padding:8px 2px;border-radius:10px;font-size:12px}.nav button.active{color:var(--teal);background:#e8f5f5;font-weight:750}.nav span{display:block;font-size:19px;margin-bottom:2px}.pill{display:inline-block;background:#e8f5f5;color:#075a63;border-radius:99px;padding:4px 9px;font-size:12px}.alert{background:#fff3dc;color:#754c00;border-radius:10px;padding:10px;font-size:13px}.sysgrid{display:grid;grid-template-columns:1fr;gap:9px}.syscard{border:1px solid var(--line);border-radius:14px;background:white;padding:12px}.syshead{font-weight:750;font-size:16px;margin-bottom:5px}.resultrow{border-top:1px solid var(--line);padding:10px 0}.resultrow:first-child{border-top:0}.hidden{display:none!important}.tabchips{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 12px}.chip.active{background:var(--teal);color:white;border-color:var(--teal)}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.smallbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 10px}.checkline{display:flex;align-items:center;gap:8px}.checkline input{width:auto}
</style></head><body><header><h1>Ординатор</h1><p>Пациенты · осмотр · лаборатория · инструментальные исследования</p></header><main class="wrap" id="app"></main><nav class="nav"><button data-page="walk" class="active"><span>🩺</span>Обход</button><button data-page="patients"><span>👥</span>Пациенты</button><button data-page="graphs"><span>📈</span>Графики</button><button data-page="calendar"><span>🗓️</span>Календарь</button><button data-page="tasks"><span>✓</span>Задачи</button></nav><script>
const systems=[{id:'general',name:'Общее состояние',exam:['Общее состояние','Сознание','Температура','Кожа и слизистые']},{id:'cardio',name:'Сердечно-сосудистая система',exam:['АД','ЧСС и ритм','Тоны сердца / шумы','Периферическая перфузия','Отеки','ЭКГ / ЭКС']},{id:'resp',name:'Дыхательная система',exam:['ЧДД','SpO₂ / кислородная поддержка','Аускультация','Дыхательная работа','Рентген / КТ грудной клетки']},{id:'gi',name:'ЖКТ',exam:['Живот','Перистальтика','Стул','Питание / переносимость']},{id:'renal',name:'Мочевыделительная система',exam:['Диурез за сутки','Баланс жидкости','Моча / катетер','Креатинин / СКФ']},{id:'neuro',name:'Нервная система',exam:['Сознание / ориентация','Зрачки','Двигательная функция','Боль / седация']},{id:'wound',name:'Рана и дренажи',exam:['Послеоперационная рана','Дренажи: тип и количество','Характер отделяемого','Признаки инфекции']},{id:'hemostasis',name:'Кровь и гемостаз',exam:['Кровоточивость','ОАК','Коагулограмма']},{id:'other',name:'Прочее',exam:['Дополнительные замечания']}];
const labs=['ОАК: Hb','ОАК: лейкоциты','ОАК: тромбоциты','СРБ','Прокальцитонин','Креатинин','Мочевина','Na⁺','K⁺','Mg²⁺','Ca²⁺','АЛТ / АСТ','Билирубин','Глюкоза','МНО / ПВ','АЧТВ','Фибриноген','Тропонин','NT-proBNP','КЩС: pH','КЩС: pCO₂','КЩС: лактат','Другое'];
const studies=['ЭКГ','ЭхоКГ: ФВ ЛЖ','ЭхоКГ: клапаны / протезы','ЭхоКГ: правые отделы / давление','Рентген грудной клетки','КТ','УЗИ / допплерография','Холтер','ФВЛГ / другое','Другое исследование'];
const labBySystem={general:['ОАК: Hb','ОАК: лейкоциты','ОАК: тромбоциты','СРБ','Прокальцитонин','Глюкоза'],cardio:['Тропонин','NT-proBNP','Na⁺','K⁺','Mg²⁺','Ca²⁺'],resp:['КЩС: pH','КЩС: pCO₂','КЩС: лактат'],gi:['АЛТ / АСТ','Билирубин','Глюкоза'],renal:['Креатинин','Мочевина','Na⁺','K⁺','Mg²⁺','Ca²⁺'],neuro:['Другое'],wound:['СРБ','Прокальцитонин','ОАК: лейкоциты'],hemostasis:['ОАК: Hb','ОАК: тромбоциты','МНО / ПВ','АЧТВ','Фибриноген'],other:['Другое']};
const studyBySystem={general:['Другое исследование'],cardio:['ЭКГ','ЭхоКГ: ФВ ЛЖ','ЭхоКГ: клапаны / протезы','ЭхоКГ: правые отделы / давление','Холтер','ФВЛГ / другое'],resp:['Рентген грудной клетки','КТ'],gi:['УЗИ / допплерография','КТ'],renal:['УЗИ / допплерография','КТ'],neuro:['КТ','Другое исследование'],wound:['УЗИ / допплерография','Другое исследование'],hemostasis:['Другое исследование'],other:['Другое исследование']};
let state=JSON.parse(localStorage.getItem('ord_v3')||'null')||{patients:[],tasks:[],events:[]};let page='walk',selected=null,patientTab='exam',activeSystem='general';const app=document.getElementById('app');const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('ord_v3',JSON.stringify(state))}function patient(id){return state.patients.find(p=>p.id===id)}function ensure(p){p.exam??={};p.rounds??=[];p.results??=[];p.results.forEach(r=>{if(!r.system)r.system='other'});p.notes??='';p.vitals??={};p.systemNotes??={};}function btn(text,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${text}</button>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(selected&&patient(selected)){renderPatient(patient(selected));return}if(page==='patients')renderPatients();else if(page==='calendar')renderCalendar();else if(page==='tasks')renderTasks();else if(page==='graphs')renderGraphs();else if(page==='walk')renderWalk();else renderToday()}
function renderWalk(){app.innerHTML=`<div class="row between"><div><div class="big">Обход</div><div class="muted">Ежедневные показатели пациентов</div></div>${btn('+ Пациент','newPatient()')}</div>${state.patients.map(p=>{ensure(p);let r=p.rounds.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];return `<div class="card"><div class="row between"><div><strong>${esc(p.name||'Новый пациент')}</strong><div class="muted">${esc(p.ward||'Палата —')} · ${esc(p.diagnosis||'Диагноз не указан')}</div></div>${btn('Открыть обход',`openPatient('${p.id}');patientTab='walk';renderPatient(patient('${p.id}'))`,'btn secondary')}</div>${r?`<div class="muted" style="margin-top:10px">Последний обход · ${esc(r.date)} · АД ${esc(r.bp||'—')} · ЧСС ${esc(r.hr||'—')} · SpO₂ ${esc(r.spo2||'—')}%</div>`:'<div class="muted" style="margin-top:10px">Записей обхода пока нет</div>'}</div>`}).join('')||'<div class="card empty">Добавь пациента, чтобы начать ежедневный обход.</div>'}`}
function renderRounds(p){ensure(p);const rows=p.rounds.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="sectionTitle">Ежедневный осмотр</div><div class="card"><label>Дата осмотра</label><input id="round-date" type="date" value="${today()}"><div class="grid"><div><label>АД, мм рт. ст.</label><input id="round-bp" placeholder="120/80"></div><div><label>ЧСС, уд/мин</label><input id="round-hr" type="number" step="1" placeholder="80"></div><div><label>ЧДД, в мин</label><input id="round-rr" type="number" step="1" placeholder="16"></div><div><label>SpO₂, %</label><input id="round-spo2" type="number" step="0.1" placeholder="98"></div><div><label>Диурез, мл</label><input id="round-urine" type="number" step="any" placeholder="1500"></div><div><label>Выпито / поступило, мл</label><input id="round-intake" type="number" step="any" placeholder="2000"></div><div><label>Температура, °C</label><input id="round-temp" type="number" step="0.1" placeholder="36.6"></div><div><label>Стул</label><input id="round-stool" placeholder="Был / не было"></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="addRound('${p.id}')">Сохранить запись обхода</button></div><div class="sectionTitle">Динамика по датам</div>${rows.length?`<div style="overflow-x:auto"><table style="border-collapse:collapse;background:white;width:100%;min-width:700px;font-size:13px"><thead><tr>${['Дата','АД','ЧСС','ЧДД','SpO₂','Диурез, мл','Выпито, мл','T°, °C','Стул',''].map(x=>`<th style="padding:9px;border:1px solid var(--line);text-align:left">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${[r.date,r.bp,r.hr,r.rr,r.spo2,r.urine,r.intake,r.temp,r.stool].map(x=>`<td style="padding:9px;border:1px solid var(--line)">${esc(x||'—')}</td>`).join('')}<td style="padding:6px;border:1px solid var(--line)"><button class="smallbtn" onclick="deleteRound('${p.id}','${r.id}')">Удалить</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Сохрани первую запись — здесь появится таблица ежедневной динамики.</div>'}`}
function addRound(pid){let p=patient(pid);ensure(p);let val=id=>document.getElementById('round-'+id).value.trim();p.rounds.push({id:'d'+Date.now(),date:val('date')||today(),bp:val('bp'),hr:val('hr'),rr:val('rr'),spo2:val('spo2'),urine:val('urine'),intake:val('intake'),temp:val('temp'),stool:val('stool')});save();renderPatient(p);toast('Запись обхода сохранена')}
function deleteRound(pid,rid){let p=patient(pid);if(confirm('Удалить запись обхода?')){p.rounds=p.rounds.filter(r=>r.id!==rid);save();renderPatient(p)}}
function renderGraphs(){let pid=document.getElementById('graph-patient')?.value||state.patients[0]?.id;let p=patient(pid);if(!p){app.innerHTML='<div class="big">Графики</div><div class="card empty">Сначала добавь пациента и внеси числовые результаты лабораторных анализов.</div>';return}ensure(p);let numeric=p.results.filter(r=>r.type==='lab'&&Number.isFinite(parseFloat(String(r.value).replace(',','.'))));let groups={};numeric.forEach(r=>(groups[r.name]??=[]).push({...r,n:parseFloat(String(r.value).replace(',','.'))}));app.innerHTML=`<div class="big">Графики анализов</div><div class="muted">Графики строятся автоматически по числовым лабораторным результатам, введённым в карточку пациента.</div><label>Пациент</label><select id="graph-patient" onchange="renderGraphs()">${state.patients.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name||'Пациент без имени')} · ${esc(x.ward||'без палаты')}</option>`).join('')}</select>${Object.keys(groups).length?Object.entries(groups).map(([name,arr])=>{arr.sort((a,b)=>a.date.localeCompare(b.date));let vals=arr.map(x=>x.n),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;let pts=arr.map((x,i)=>({x:36+(arr.length===1?0:i*260/(arr.length-1)),y:110-(x.n-min)/range*80,...x}));return `<div class="card"><strong>${esc(name)}</strong><div class="muted">${arr.length} числовых результатов · даты по горизонтали</div><svg viewBox="0 0 320 150" role="img" aria-label="График ${esc(name)}" style="width:100%;height:auto;margin-top:8px"><line x1="30" y1="110" x2="300" y2="110" stroke="#cbd8db"/><line x1="30" y1="20" x2="30" y2="110" stroke="#cbd8db"/><polyline fill="none" stroke="#087f8c" stroke-width="2.5" points="${pts.map(q=>`${q.x},${q.y}`).join(' ')}"/>${pts.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="3.5" fill="#087f8c"><title>${esc(q.date)}: ${q.n}</title></circle>`).join('')}<text x="30" y="130" font-size="9" fill="#64747a">${esc(arr[0].date)}</text><text x="300" y="130" text-anchor="end" font-size="9" fill="#64747a">${esc(arr[arr.length-1].date)}</text><text x="28" y="15" font-size="10" fill="#64747a">${max}</text><text x="28" y="105" font-size="10" fill="#64747a">${min}</text></svg><div class="muted">${arr.map(x=>`${esc(x.date)}: ${esc(x.value)}${x.comment?' '+esc(x.comment):''}`).join(' · ')}</div></div>`}).join(''):'<div class="card empty">Пока нет числовых лабораторных результатов. В карточке пациента открой «Лаборатория» и вводи результат числом, например 125 или 4.2. График появится автоматически. Текстовые заключения не строятся на графике.</div>'}`}
function renderToday(){app.innerHTML=`<div class="row between"><div><div class="big">Сегодня</div><div class="muted">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div></div>${btn('+ Пациент','newPatient()')}</div><div class="grid"><div class="card"><div class="muted">Активные пациенты</div><div class="big">${state.patients.length}</div></div><div class="card"><div class="muted">Незакрытые задачи</div><div class="big">${state.tasks.filter(t=>!t.done).length}</div></div></div><div class="sectionTitle">Пациенты</div>${state.patients.length?state.patients.map(p=>`<div class="card" onclick="openPatient('${p.id}')"><div class="row between"><strong>${esc(p.name||'Новый пациент')}</strong><span class="pill">${esc(p.ward||'Палата —')}</span></div><div class="muted">${esc(p.diagnosis||'Диагноз не указан')}</div><div class="row between" style="margin-top:12px"><span class="muted">Открыть карту →</span>${btn('Осмотр и анализы',`openPatient('${p.id}')`,'btn secondary')}</div></div>`).join(''):`<div class="card empty">Пока нет пациентов.<br>Добавь первого, чтобы начать вести осмотр и результаты.</div>`}<div class="sectionTitle">Задачи на сегодня</div>${state.tasks.filter(t=>!t.done&&(t.date||today())<=today()).slice(0,6).map(taskCard).join('')||'<div class="card muted">Нет просроченных или сегодняшних задач.</div>'}`}
function renderPatients(){app.innerHTML=`<div class="row between"><div class="big">Пациенты</div>${btn('+ Добавить','newPatient()')}</div>${state.patients.map(p=>`<div class="card"><div class="row between"><div onclick="openPatient('${p.id}')"><strong>${esc(p.name||'Новый пациент')}</strong><div class="muted">${esc(p.ward||'Палата —')} · ${esc(p.diagnosis||'Диагноз не указан')}</div></div>${btn('Открыть',`openPatient('${p.id}')`,'btn secondary')}</div></div>`).join('')||'<div class="card empty">Добавь первого пациента.</div>'}`}
function newPatient(){let id='p'+Date.now();state.patients.push({id,name:'',ward:'',diagnosis:'',active:true,exam:{},results:[],notes:'',systemNotes:{},created:today()});save();selected=id;renderPatient(patient(id))}function openPatient(id){selected=id;ensure(patient(id));patientTab='exam';render()}
function renderPatient(p){ensure(p);app.innerHTML=`<div class="row between"><button class="btn ghost" onclick="selected=null;render()">← Назад</button>${btn('Сохранить','savePatientForm()')}</div><div class="card"><label>ФИО / условное обозначение</label><input id="pname" value="${esc(p.name)}" placeholder="Например, Пациент 01"><div class="grid"><div><label>Палата</label><input id="pward" value="${esc(p.ward)}" placeholder="№"></div><div><label>Дата поступления</label><input id="pdate" type="date" value="${esc(p.created||today())}"></div></div><label>Диагноз</label><textarea id="pdiag" placeholder="Основной диагноз, операция, послеоперационный день">${esc(p.diagnosis)}</textarea></div><div class="tabchips"><button class="chip ${patientTab==='walk'?'active':''}" onclick="patientTab='walk';renderPatient(patient('${p.id}'))">Обход</button><button class="chip ${patientTab==='exam'?'active':''}" onclick="patientTab='exam';renderPatient(patient('${p.id}'))">Осмотр по системам</button><button class="chip ${patientTab==='labs'?'active':''}" onclick="patientTab='labs';renderPatient(patient('${p.id}'))">Лаборатория</button><button class="chip ${patientTab==='studies'?'active':''}" onclick="patientTab='studies';renderPatient(patient('${p.id}'))">Инструментальные</button><button class="chip ${patientTab==='history'?'active':''}" onclick="patientTab='history';renderPatient(patient('${p.id}'))">История результатов</button></div>${patientTab==='walk'?renderRounds(p):patientTab==='exam'?renderExam(p):patientTab==='labs'?renderResults(p,'lab'):patientTab==='studies'?renderResults(p,'study'):patientTab==='history'?renderHistory(p):renderHistory(p)}<div class="sectionTitle">Общие замечания / план</div><textarea id="pnotes" placeholder="Важные жалобы, проблемы, план наблюдения">${esc(p.notes||'')}</textarea><div class="row" style="margin-top:12px">${btn('Сохранить карту','savePatientForm()')}${btn('Удалить пациента',`deletePatient('${p.id}')`,'btn danger')}</div><div class="alert" style="margin-top:14px">Прототип хранит данные только в памяти браузера этого устройства. Не вводи реальные идентифицирующие данные пациентов.</div>`}
function renderExam(p){const fields=[{id:'cardio',name:'Сердечно-сосудистая система',items:[{key:'АД',label:'АД',placeholder:'Например: 120/70 мм рт. ст.'},{key:'ЧСС',label:'ЧСС',placeholder:'уд/мин'},{key:'Тоники',label:'Тоники — препараты и параметры',placeholder:'Препарат, доза, скорость инфузии; например норадреналин … мкг/кг/мин'},{key:'ЭКС',label:'ЭКС — режим и параметры',placeholder:'Режим, частота, mA / напряжение, чувствительность'}]},{id:'resp',name:'Дыхательная система',items:[{key:'ЧДД',label:'ЧДД',placeholder:'дых/мин'},{key:'Сатурация',label:'Сатурация (SpO₂)',placeholder:'%, укажи кислородную поддержку при необходимости'}]},{id:'renal',name:'Баланс жидкости',items:[{key:'Баланс жидкости',label:'Баланс жидкости за период',placeholder:'Поступило, выделено, диурез и итоговый баланс в мл; укажи период'}]}];return `<div class="sectionTitle">Результаты осмотра и параметры</div><label>Дата и время осмотра</label><input type="datetime-local" id="examdate" value="${esc(p.examDate||new Date().toISOString().slice(0,16))}"><div class="muted" style="margin:8px 0 12px">Оставлены только выбранные показатели. Лабораторные и инструментальные результаты находятся в соответствующих системах на соседних вкладках.</div><div class="sysgrid">${fields.map(s=>`<div class="syscard"><div class="syshead">${s.name}</div>${s.items.map(item=>`<label>${item.label}</label><textarea data-exam="${esc(s.id+'|'+item.key)}" placeholder="${esc(item.placeholder)}">${esc((p.exam[s.id]||{})[item.key]||'')}</textarea>`).join('')}</div>`).join('')}</div>`}
function renderResults(p,type){let options=type==='lab'?labs:studies;let title=type==='lab'?'Лабораторные показатели':'Инструментальные исследования';return `<div class="sectionTitle">${title} по системам</div><div class="muted">Каждая запись относится к конкретной системе. Новые результаты сохраняются в истории пациента с датой.</div>${systems.map(s=>{let arr=p.results.filter(r=>r.type===type&&(r.system||'other')===s.id);let picks=(type==='lab'?labBySystem:studyBySystem)[s.id]||options;return `<div class="syscard" style="margin:10px 0"><div class="syshead">${s.name}</div><div class="muted">${type==='lab'?'Лабораторные показатели':'Инструментальные исследования'}</div><label>Показатель / исследование</label><select id="rname-${s.id}">${picks.map(x=>`<option>${esc(x)}</option>`).join('')}<option value="__custom">Другое (ввести вручную)</option></select><input id="rcustom-${s.id}" placeholder="Название, если выбрано «Другое»" style="margin-top:7px"><label>Дата</label><input id="rdate-${s.id}" type="date" value="${today()}"><div class="grid"><div><label>${type==='lab'?'Текущий результат':'Данные / заключение'}</label><textarea id="rvalue-${s.id}" placeholder="Значение, единицы или заключение"></textarea></div><div><label>Предыдущий результат</label><textarea id="rprev-${s.id}" placeholder="Значение и дата"></textarea></div></div><label>Отметка</label><select id="rflag-${s.id}"><option value="">Без отметки</option><option value="attention">Требует внимания</option><option value="critical">Критическое / срочно проверить</option></select><label>Комментарий / референс</label><input id="rcomment-${s.id}" placeholder="Единицы, референс, динамика"><button class="btn" style="width:100%;margin-top:10px" onclick="addResult('${p.id}','${type}','${s.id}')">+ Добавить в «${s.name}»</button>${arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="resultrow"><div class="row between"><strong>${esc(r.name)}</strong><span class="muted">${esc(r.date)}</span></div>${r.flag?`<div class="${r.flag==='critical'?'alert':'pill'}" style="margin:7px 0">${r.flag==='critical'?'Проверить срочно':'Требует внимания'}</div>`:''}<div class="muted" style="margin-top:6px">Результат / заключение</div><div>${esc(r.value||'—')}</div><div class="muted" style="margin-top:6px">Предыдущий результат</div><div>${esc(r.previous||'—')}</div>${r.comment?`<div class="muted" style="margin-top:6px">${esc(r.comment)}</div>`:''}<div style="text-align:right;margin-top:8px">${btn('Удалить',`deleteResult('${p.id}','${r.id}')`,'smallbtn')}</div></div>`).join('')||'<div class="muted" style="margin-top:10px">Записей пока нет.</div>'}</div>`}).join('')}`}
function renderHistory(p){return `<div class="sectionTitle">Все результаты по датам</div>${p.results.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="card"><div class="row between"><strong>${esc(r.name)}</strong><span class="muted">${esc(r.date)}</span></div><div class="muted">${r.type==='lab'?'Лаборатория':'Инструментальное исследование'} · ${esc((systems.find(s=>s.id===(r.system||'other'))||systems[8]).name)}</div><div style="margin-top:7px">${esc(r.value||'—')}</div>${r.previous?`<div class="muted">Предыдущий: ${esc(r.previous)}</div>`:''}</div>`).join('')||'<div class="card empty">История появится после добавления результатов.</div>'}`}
function savePatientForm(){let p=patient(selected);if(!p)return;ensure(p);p.name=document.getElementById('pname').value.trim();p.ward=document.getElementById('pward').value.trim();p.created=document.getElementById('pdate').value;p.diagnosis=document.getElementById('pdiag').value;p.notes=document.getElementById('pnotes').value;p.examDate=document.getElementById('examdate')?.value||p.examDate||today();document.querySelectorAll('[data-exam]').forEach(el=>{let [sid,item]=el.dataset.exam.split('|');p.exam[sid]??={};p.exam[sid][item]=el.value});document.querySelectorAll('[data-sysnote]').forEach(el=>p.systemNotes[el.dataset.sysnote]=el.value);save();renderPatient(p);toast('Карта сохранена')}
function addResult(pid,type,system){let p=patient(pid);const value=document.getElementById('rvalue-'+system).value.trim();if(!value){toast('Введи результат или заключение');return}const sel=document.getElementById('rname-'+system);const custom=document.getElementById('rcustom-'+system).value.trim();const name=sel.value==='__custom'?(custom||'Другое'):sel.value;p.results.push({id:'r'+Date.now(),type,system,name,date:document.getElementById('rdate-'+system).value||today(),value,previous:document.getElementById('rprev-'+system).value.trim(),flag:document.getElementById('rflag-'+system).value,comment:document.getElementById('rcomment-'+system).value.trim()});save();renderPatient(p)}function deleteResult(pid,rid){if(confirm('Удалить эту запись?')){let p=patient(pid);p.results=p.results.filter(r=>r.id!==rid);save();renderPatient(p)}}function deletePatient(id){if(confirm('Удалить карточку пациента и все её записи?')){state.patients=state.patients.filter(p=>p.id!==id);save();selected=null;render()}}
function renderCalendar(){app.innerHTML=`<div class="big">Календарь</div><div class="card"><label>Дата</label><input id="eventdate" type="date" value="${today()}"><label>Пациент</label><select id="eventpatient"><option value="">Общее</option>${state.patients.map(p=>`<option value="${p.id}">${esc(p.name||'Пациент без имени')}</option>`).join('')}</select><label>Событие / исследование</label><input id="eventtitle" placeholder="Например, ОАК, ЭхоКГ, консультация"><button class="btn" style="width:100%;margin-top:12px" onclick="addEvent()">Добавить в календарь</button></div>${state.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="card"><div class="row between"><strong>${esc(e.title)}</strong><span class="pill">${esc(e.date)}</span></div><div class="muted">${esc(patient(e.pid)?.name||'Общее')}</div></div>`).join('')||'<div class="card empty">Событий пока нет.</div>'}`}
function addEvent(){let title=document.getElementById('eventtitle').value.trim();if(!title)return;state.events.push({id:'e'+Date.now(),date:document.getElementById('eventdate').value||today(),pid:document.getElementById('eventpatient').value,title});save();renderCalendar()}
function taskCard(t){return `<div class="card"><div class="checkline"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div style="flex:1"><strong>${esc(t.title)}</strong><div class="muted">${esc(t.date||'Без даты')}</div></div></div></div>`}function renderTasks(){app.innerHTML=`<div class="big">Задачи</div><div class="card"><label>Задача</label><input id="tasktitle" placeholder="Что нужно сделать"><label>Срок</label><input id="taskdate" type="date" value="${today()}"><label>Пациент</label><select id="taskpatient"><option value="">Общее</option>${state.patients.map(p=>`<option value="${p.id}">${esc(p.name||'Пациент без имени')}</option>`).join('')}</select><button class="btn" style="width:100%;margin-top:12px" onclick="addTask()">Добавить задачу</button></div>${state.tasks.map(t=>taskCard(t)).join('')||'<div class="card empty">Задач пока нет.</div>'}`}
function addTask(){let title=document.getElementById('tasktitle').value.trim();if(!title)return;state.tasks.push({id:'t'+Date.now(),title,date:document.getElementById('taskdate').value||today(),pid:document.getElementById('taskpatient').value,done:false});save();renderTasks()}function toggleTask(id){let t=state.tasks.find(t=>t.id===id);t.done=!t.done;save();render()}function toast(s){let n=document.createElement('div');n.textContent=s;n.style='position:fixed;bottom:88px;left:12%;width:76%;background:#18383d;color:white;padding:13px;border-radius:12px;text-align:center;z-index:10';document.body.appendChild(n);setTimeout(()=>n.remove(),1800)}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{selected=null;page=b.dataset.page;render()}));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
